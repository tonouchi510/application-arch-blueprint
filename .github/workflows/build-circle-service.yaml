name: Build and deploy circle-service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/circle-service/**/*"
      - ".github/workflows/deploy-circle-service.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/circle-service/**/*"
      - ".github/workflows/deploy-circle-service.yaml"

defaults:
  run:
    working-directory: ./backend/circle-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.26.1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Test
        run: |
          make test

  build-and-push:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      DOCKER_BUILDKIT: 1
      ARTIFACT_REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}
      IMAGE_NAME: circle-service
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build & push docker image (production)
        if: github.ref == 'refs/heads/main'
        id: build-prod
        run: |
          docker build \
              --platform linux/amd64 --cache-from=$ARTIFACT_REPOSITORY/$IMAGE_NAME:latest --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t $ARTIFACT_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG -t $ARTIFACT_REPOSITORY/$IMAGE_NAME:latest .
          docker push $ARTIFACT_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ARTIFACT_REPOSITORY/$IMAGE_NAME:latest

      - name: Build & push docker image (development)
        if: github.ref == 'refs/heads/develop'
        id: build-dev
        run: |
          docker build \
              --platform linux/amd64 --cache-from=$ARTIFACT_REPOSITORY/$IMAGE_NAME:dev --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t $ARTIFACT_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG -t $ARTIFACT_REPOSITORY/$IMAGE_NAME:dev .
          docker push $ARTIFACT_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ARTIFACT_REPOSITORY/$IMAGE_NAME:dev

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (production)
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: circle-service
          image: ${{ secrets.ARTIFACT_REPOSITORY }}/circle-service:latest
          region: asia-northeast1

      - name: Deploy to Cloud Run (development)
        if: github.ref == 'refs/heads/develop'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: circle-service-dev
          image: ${{ secrets.ARTIFACT_REPOSITORY }}/circle-service:dev
          region: asia-northeast1
