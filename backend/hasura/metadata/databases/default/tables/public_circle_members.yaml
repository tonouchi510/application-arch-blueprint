table:
  name: circle_members
  schema: public
object_relationships:
  - name: circle
    using:
      foreign_key_constraint_on: circle_uuid
select_permissions:
  - role: freemium
    permission:
      columns:
        - user_id
        - joined_date
        - created_at
        - updated_at
        - circle_uuid
        - uuid
      filter: {}
      allow_aggregations: true
    comment: ""
  - role: premium
    permission:
      columns:
        - user_id
        - joined_date
        - created_at
        - updated_at
        - circle_uuid
        - uuid
      filter: {}
      allow_aggregations: true
    comment: ""
