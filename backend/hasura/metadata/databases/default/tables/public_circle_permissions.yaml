table:
  name: circle_permissions
  schema: public
object_relationships:
  - name: circle
    using:
      foreign_key_constraint_on: circle_uuid
select_permissions:
  - role: freemium
    permission:
      columns:
        - permission_board_creation
        - permission_self_join
        - created_at
        - updated_at
        - circle_uuid
      filter: {}
    comment: ""
  - role: premium
    permission:
      columns:
        - permission_board_creation
        - permission_self_join
        - created_at
        - updated_at
        - circle_uuid
      filter: {}
    comment: ""
