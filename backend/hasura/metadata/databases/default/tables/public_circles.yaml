table:
  name: circles
  schema: public
array_relationships:
  - name: boards
    using:
      foreign_key_constraint_on:
        column: circle_uuid
        table:
          name: boards
          schema: public
  - name: circle_members
    using:
      foreign_key_constraint_on:
        column: circle_uuid
        table:
          name: circle_members
          schema: public
  - name: circle_permissions
    using:
      foreign_key_constraint_on:
        column: circle_uuid
        table:
          name: circle_permissions
          schema: public
select_permissions:
  - role: freemium
    permission:
      columns:
        - owner_id
        - description
        - name
        - created_at
        - updated_at
        - uuid
      filter: {}
    comment: ""
  - role: premium
    permission:
      columns:
        - owner_id
        - description
        - name
        - created_at
        - updated_at
        - uuid
      filter: {}
    comment: ""
