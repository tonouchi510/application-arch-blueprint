table:
  name: posts
  schema: public
object_relationships:
  - name: board
    using:
      foreign_key_constraint_on: board_uuid
select_permissions:
  - role: freemium
    permission:
      columns:
        - user_id
        - content
        - created_at
        - updated_at
        - board_uuid
        - uuid
      filter:
        _or:
          - board:
              circle:
                owner_id:
                  _eq: X-Hasura-User-Id
          - board:
              circle:
                circle_members:
                  user_id:
                    _eq: X-Hasura-User-Id
    comment: ""
  - role: premium
    permission:
      columns:
        - user_id
        - content
        - created_at
        - updated_at
        - board_uuid
        - uuid
      filter:
        _or:
          - board:
              circle:
                owner_id:
                  _eq: X-Hasura-User-Id
          - board:
              circle:
                circle_members:
                  user_id:
                    _eq: X-Hasura-User-Id
    comment: ""
