services:
  postgres:
    image: postgres:16.2
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - ./snippet/init-db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - TZ=TZ

  circle-service:
    build: ./backend/circle-service
    ports:
      - "5001:5001"
    depends_on:
      - "postgres"
      - "firebase-emulator"
    restart: always
    environment:
      - ENV=local
      - PORT=5001
      - TZ=Asia/Tokyo
      - DATABASE_URL=postgres://postgres:password@postgres:5432/main
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - HASURA_REGISTER_SECRET=secret

  # ローカル実行時、circle-serviceとFlutterアプリ(local flavor)はここに向けてFirebase Authを利用する
  # Auth EmulatorはisEmulator扱いとなり実クレデンシャルを使わないため、サービスアカウントキーは不要
  firebase-emulator:
    build:
      context: .
      dockerfile: backend/firebase-emulator/Dockerfile
    ports:
      - "9099:9099" # Auth Emulator
      - "4000:4000" # Emulator UI
      - "4400:4400" # Emulator Hub (make firebase-emulator-seed-update用)
    restart: always

  # ローカル実行時のみ使用。Auth Emulatorが発行する無署名トークンを検証してHasuraへX-Hasura-*ヘッダーを返す
  local-auth-webhook:
    build: ./backend/local-auth-webhook
    depends_on:
      - "firebase-emulator"
    restart: always
    environment:
      - PORT=5002
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099

  hasura-gateway:
    image: hasura/graphql-engine:latest.cli-migrations-v3
    ports:
      - "8080:8080"
    volumes:
      - ./backend/hasura/migrations:/hasura-migrations
      - ./backend/hasura/metadata:/hasura-metadata
    depends_on:
      - "postgres"
      - "local-auth-webhook"
    restart: always
    environment:
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:password@postgres:5432/main
      ## this env var can be used to add the above postgres database to Hasura as a data source. this can be removed/updated based on your needs
      BACKEND_SERVICE_DB_URL: postgres://postgres:password@postgres:5432/main
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false" # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      # authentication
      HASURA_GRAPHQL_ADMIN_SECRET: password
      # 本番はHASURA_GRAPHQL_JWT_SECRETでFirebaseのJWKを直接検証する構成を想定:
      # HASURA_GRAPHQL_JWT_SECRET: '{"type":"RS256","jwk_url": "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com", "audience": "${FIREBASE_PROJECT_ID}", "issuer": "https://securetoken.google.com/${FIREBASE_PROJECT_ID}"}'
      # Auth Emulatorのトークンは無署名でJWK検証を通せないため、ローカルはlocal-auth-webhookによる認証ウェブフックモードを使用する
      HASURA_GRAPHQL_AUTH_HOOK: http://local-auth-webhook:5002/webhook
      HASURA_GRAPHQL_AUTH_HOOK_MODE: POST
      # remote schema
      HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS: "true"
      CIRCLE_SERVICE_GRAPHQL_ENDPOINT: http://circle-service:5001/query
      CIRCLE_SERVICE_GRAPHQL_ENDPOINT_SECRET: secret
