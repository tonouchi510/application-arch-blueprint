mutation CreateBoard($input: CreateBoardInput!) {
  create_board(input: $input) {
    id
    circle_uuid
    topic
    status
  }
}

mutation ChangeBoardTopic($input: ChangeBoardTopicInput!) {
  change_board_topic(input: $input) {
    id
    circle_uuid
    topic
    status
  }
}

mutation ChangeBoardStatus($input: ChangeBoardStatusInput!) {
  change_board_status(input: $input) {
    id
    circle_uuid
    topic
    status
  }
}

mutation AddBoardPost($input: AddBoardPostInput!) {
  add_board_post(input: $input) {
    id
    circle_uuid
    topic
    status
  }
}

mutation DeleteBoard($input: DeleteBoardInput!) {
  delete_board(input: $input)
}
