
# ============================================================
# Remote schema types from circle-service
# ============================================================

scalar UUID

type BoardModel {
  circle_uuid: UUID!
  id: UUID!
  status: String!
  topic: String!
}

type CircleModel {
  description: String!
  id: UUID!
  name: String!
  owner_id: ID!
}

input AddBoardPostInput {
  board_id: UUID!
  circle_id: UUID!
  content: String!
  user_id: ID!
}

input AddCircleMemberInput {
  circle_id: UUID!
  new_member_id: ID!
}

input ChangeBoardCreationPermissionInput {
  allowed: Boolean!
  circle_id: UUID!
}

input ChangeBoardStatusInput {
  board_id: UUID!
  circle_id: UUID!
  new_status: Int!
}

input ChangeBoardTopicInput {
  board_id: UUID!
  circle_id: UUID!
  new_topic: String!
}

input ChangeCircleDescriptionInput {
  circle_id: UUID!
  new_description: String!
}

input ChangeCircleNameInput {
  circle_id: UUID!
  new_name: String!
}

input CreateBoardInput {
  circle_id: UUID!
  topic: String!
}

input CreateCircleInput {
  description: String!
  name: String!
}

input DelegateCircleOwnerInput {
  circle_id: UUID!
  new_owner_id: ID!
}

input DeleteBoardInput {
  board_id: UUID!
  circle_id: UUID!
}

input DeleteCircleInput {
  circle_id: UUID!
}
